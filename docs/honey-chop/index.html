// ---- detuning 8-bit march ----

function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / (p.max * 0.5), 0, 1);
    ctx.globalAlpha = a;
    switch (p.t) {
      case 'fluff':
        ctx.fillStyle = P('#fbf5e6');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, TAU);
        ctx.moveTo(p.x + Math.cos(p.rot) * p.r * 0.7 + p.r * 0.7, p.y + Math.sin(p.rot) * p.r * 0.7);
        ctx.arc(p.x + Math.cos(p.rot) * p.r * 0.7, p.y + Math.sin(p.rot) * p.r * 0.7, p.r * 0.7, 0, TAU);
        ctx.fill();

        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.rot) * 6, p.y + Math.sin(p.rot) * 6); ctx.stroke();

        ctx.beginPath();

}

      seesOn = !seesOn;
      seesT = seesOn ? rand(0.06, 0.45) : rand(0.15, 1.1);
      if (seesOn) { seesX = rand(240, 560); seesY = rand(175, 330); seesS = randi(40, 70); }
    }
  } else seesOn = false;
  if (state === 'play') updatePlay(dt);
  else if (state === 'van') updateVan(dt);
  else if (state === 'gameover') updateGameOver(dt);
  updateHand(dt);
  updateFX(dt);
  updateGiant(dt);
  if ((state === 'play' || state === 'van') && horror > 0.5) {
    heartT -= dt;
    if (heartT <= 0) {
      SFX.heart(); heartPulse = 1;
      heartT = credit <= 0 ? 0.5 : lerp(0.62, 0.95, clamp(credit / 20, 0, 1));
    }
  } else heartT = 0.25;
}

// ---------------------------------------------------------------------
//  render + loop
// ---------------------------------------------------------------------
function render() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (state === 'title') drawTitle();
  else {
    const sx = (Math.random() * 2 - 1) * shake, sy = (Math.random() * 2 - 1) * shake;
    ctx.setTransform(RS, 0, 0, RS, sx * RS, sy * RS);
    drawWorld();
    drawPops();
    drawSees();
    ctx.setTransform(RS, 0, 0, RS, sx * 0.25 * RS, sy * 0.25 * RS);
    if (state === 'play' || (state === 'van' && vanT > 4.3)) drawButtons();
    if (state !== 'gameover') drawHUD();
    if (state === 'van') drawVanCard();
    if (state === 'gameover') drawGameOver();
  }
  postFX();
}
let last = performance.now();
function frame(nowT) {
  const dt = Math.min(0.05, Math.max(0, (nowT - last) / 1000));
  last = nowT;
  T += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------------
//  input
// ---------------------------------------------------------------------
window.addEventListener('keydown', e => {
  const c = e.code, k = e.key;
  const isSpace = c === 'Space' || k === ' ' || k === 'Spacebar';
  const isDown = c === 'ArrowDown' || k === 'ArrowDown' || k === 'Down';
  const isUp = c === 'ArrowUp' || k === 'ArrowUp' || k === 'Up';
  const isEnter = c === 'Enter' || c === 'NumpadEnter' || k === 'Enter';
  if (isSpace || isDown || isUp || c === 'ArrowLeft' || c === 'ArrowRight') e.preventDefault();
  if (e.repeat) return;
  initAudio();
  if (state === 'title') { if (isEnter) startGame(); return; }
  if (state === 'gameover') { if (isEnter && goT > 1.2) startGame(); return; }
  if (state === 'play') {
    if (isSpace || isDown) chop();
    else if (isUp) salute();
  }
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'touch' || e.pointerType === 'pen') usingTouch = true;
  initAudio();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W;
  if (state === 'title') { startGame(); return; }
  if (state === 'gameover') { if (goT > 1.2) startGame(); return; }
  if (state === 'play') { if (x < W / 2) chop(); else salute(); }
});
cv.addEventListener('touchend', () => initAudio(), { passive: true });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('pagehide', saveBest);
</script>
